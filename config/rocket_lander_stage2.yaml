# ML-Agents trainer config - Rocket Lander, STAGE 2 (random position, bounded tilt, initial motion)
# Warm start from the Stage 1 policy (same 22 observations / 3 actions):
#   .\.venv\Scripts\python -m mlagents.trainers.learn config/rocket_lander_stage2.yaml --run-id=stage2_v1 --initialize-from=stage1_v1 --torch-device=cpu
# then press Play in the Unity Editor (scene Assets/RocketLander/Scenes/RocketTraining.unity).
#
# Changes vs. Stage 1: reward v2 (set on the prefab: precision bonus 8 within 3 m, soft-landing bonus 5,
# near-pad distance shaping 0.7/m), gamma 0.99 -> 0.995, time_horizon 128 -> 256, longer episodes,
# more fuel and larger bounds, 5-lesson curriculum up to 30 deg tilt / 20 m offset / 35 m height.

behaviors:
  RocketLander:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995                # flights now last 10-25 s (100-250 decisions): look further ahead
        strength: 1.0
    time_horizon: 256
    max_steps: 2.0e7                # ~3.3 h in the Editor at ~100k steps/min; Ctrl+C early if converged
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 10

# Curriculum: every spawn parameter uses identical criteria per lesson, so they advance together.
# Thresholds were calibrated in Unity (reward v2): a landing returns ~16-19 (Stage-1-quality landing)
# to ~22-27 (precise and soft, PD autopilot); failures ~ -4..-8. The thresholds below correspond to
# roughly 66-90 % landings depending on landing quality.
environment_parameters:
  spawn_height_min:
    curriculum:
      - name: L0_Stage1
        completion_criteria: &L0
          measure: reward
          behavior: RocketLander
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 13.0
        value: 8.0
      - name: L1
        completion_criteria: &L1
          measure: reward
          behavior: RocketLander
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 13.5
        value: 10.0
      - name: L2
        completion_criteria: &L2
          measure: reward
          behavior: RocketLander
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 14.0
        value: 10.0
      - name: L3
        completion_criteria: &L3
          measure: reward
          behavior: RocketLander
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 15.0
        value: 10.0
      - name: L4_Final
        value: 10.0
  spawn_height_max:
    curriculum:
      - { name: L0_Stage1, completion_criteria: *L0, value: 15.0 }
      - { name: L1, completion_criteria: *L1, value: 20.0 }
      - { name: L2, completion_criteria: *L2, value: 25.0 }
      - { name: L3, completion_criteria: *L3, value: 30.0 }
      - { name: L4_Final, value: 35.0 }
  spawn_horizontal_radius:        # m
    curriculum:
      - { name: L0_Stage1, completion_criteria: *L0, value: 2.0 }
      - { name: L1, completion_criteria: *L1, value: 5.0 }
      - { name: L2, completion_criteria: *L2, value: 10.0 }
      - { name: L3, completion_criteria: *L3, value: 15.0 }
      - { name: L4_Final, value: 20.0 }
  spawn_tilt_max_deg:             # recoverability checked with the PD autopilot (98.9 % at 30 deg)
    curriculum:
      - { name: L0_Stage1, completion_criteria: *L0, value: 5.0 }
      - { name: L1, completion_criteria: *L1, value: 10.0 }
      - { name: L2, completion_criteria: *L2, value: 15.0 }
      - { name: L3, completion_criteria: *L3, value: 22.0 }
      - { name: L4_Final, value: 30.0 }
  spawn_speed_max:                # m/s
    curriculum:
      - { name: L0_Stage1, completion_criteria: *L0, value: 1.5 }
      - { name: L1, completion_criteria: *L1, value: 2.0 }
      - { name: L2, completion_criteria: *L2, value: 3.0 }
      - { name: L3, completion_criteria: *L3, value: 4.0 }
      - { name: L4_Final, value: 5.0 }
  spawn_angular_speed_max:        # rad/s
    curriculum:
      - { name: L0_Stage1, completion_criteria: *L0, value: 0.0 }
      - { name: L1, completion_criteria: *L1, value: 0.1 }
      - { name: L2, completion_criteria: *L2, value: 0.2 }
      - { name: L3, completion_criteria: *L3, value: 0.3 }
      - { name: L4_Final, value: 0.4 }

  # Constant in Stage 2
  fuel_capacity: 100.0
  max_episode_seconds: 45.0
  bounds_radius: 45.0             # ground extends 50 m around each pad; neighbouring areas are 100 m apart
  ceiling_height: 60.0            # = altitude observation scale
  wind_speed_min: 0.0             # Stage 3
  wind_speed_max: 0.0
  gust_speed_max: 0.0
  turbulence_intensity: 0.0
